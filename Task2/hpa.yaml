apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: insuretech-test-app-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: insuretech-test-app # Имя Deployment, который мы хотим масштабировать
  minReplicas: 1 # Минимальное количество реплик
  maxReplicas: 10 # Максимальное количество реплик
  metrics:
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80 # Целевой уровень утилизации памяти в процентах от запрошенной памяти