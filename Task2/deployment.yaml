apiVersion: apps/v1
kind: Deployment
metadata:
  name: insuretech-test-app
  labels:
    app: insuretech-test-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insuretech-test-app
  template:
    metadata:
      labels:
        app: insuretech-test-app
    spec:
      containers:
      - name: insuretech-test-app-container
        image: scaletestapp:1.0.0
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: "15Mi"
          requests:
            memory: "10Mi"
